<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1726">
    <title>Weather Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1726;
        color: #eef5ff;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      main { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 64px; }
      .eyebrow { color: #77d5c0; font-size: 0.76rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
      h1 { margin: 8px 0; font-size: clamp(2.2rem, 5vw, 3.6rem); letter-spacing: -0.05em; }
      .intro { margin: 0; color: #9aacc2; }
      .toolbar { display: flex; gap: 12px; margin: 32px 0 12px; }
      input, button { min-height: 48px; border: 1px solid #293b50; border-radius: 12px; font: inherit; }
      input { flex: 1; min-width: 0; padding: 0 16px; color: #eef5ff; background: #111f30; }
      input:focus { outline: 2px solid #4bd1b3; outline-offset: 2px; }
      button { padding: 0 20px; color: #06251f; background: #62e0c0; border: 0; font-weight: 750; cursor: pointer; }
      button:disabled { opacity: 0.65; cursor: wait; }
      #status { min-height: 24px; margin: 0 0 20px; color: #9aacc2; }
      #status.error { color: #ff9d9d; }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 32px 0 14px; }
      h2 { margin: 0; font-size: 1.2rem; }
      .section-note { color: #8396ad; font-size: 0.84rem; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
      .card, .panel { border: 1px solid #213247; border-radius: 18px; background: linear-gradient(145deg, #142438, #101c2c); }
      .card { padding: 20px; }
      .card h3 { margin: 0 0 16px; color: #d7e7f8; font-size: 0.96rem; }
      .card-temp { font-size: 2rem; font-weight: 750; letter-spacing: -0.05em; }
      .card-detail { margin-top: 7px; color: #98abc0; font-size: 0.88rem; }
      .panel { padding: 20px; }
      .chart-wrap { height: 290px; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
      th, td { padding: 13px 12px; border-bottom: 1px solid #233449; }
      th { color: #91a5bc; font-size: 0.75rem; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; }
      td { color: #dbe7f4; font-size: 0.9rem; }
      tbody tr:last-child td { border-bottom: 0; }
      .empty { color: #98abc0; text-align: center; }
      @media (max-width: 600px) {
        main { width: min(100% - 28px, 1160px); padding-top: 32px; }
        .toolbar { flex-direction: column; }
        button { width: 100%; }
        .panel { padding: 14px; }
        .chart-wrap { height: 240px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">Live observations · Open-Meteo</div>
        <h1>Weather tracker</h1>
        <p class="intro">A clear view of the cities you care about.</p>
      </header>

      <form id="refresh-form" class="toolbar">
        <input id="city-input" name="city" type="text" maxlength="200" placeholder="Enter a city, e.g. Pune" aria-label="City name" required>
        <button id="refresh-button" type="submit">Add / Refresh</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>

      <section aria-labelledby="summary-title">
        <div class="section-heading">
          <h2 id="summary-title">City summaries</h2>
          <span class="section-note">Latest temperature · average · observations</span>
        </div>
        <div id="summary-cards" class="cards"></div>
      </section>

      <section aria-labelledby="chart-title">
        <div class="section-heading">
          <h2 id="chart-title">Temperature history</h2>
          <span class="section-note">Most recent observations</span>
        </div>
        <div class="panel chart-wrap"><canvas id="temperature-chart" aria-label="Line chart of recent temperatures"></canvas></div>
      </section>

      <section aria-labelledby="logs-title">
        <div class="section-heading">
          <h2 id="logs-title">Recent logs</h2>
          <span class="section-note">Latest 50 observations</span>
        </div>
        <div class="panel table-wrap">
          <table>
            <thead>
              <tr><th>City</th><th>Temperature</th><th>Condition</th><th>Humidity</th><th>Wind</th><th>Logged</th></tr>
            </thead>
            <tbody id="logs-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#refresh-form");
      const cityInput = document.querySelector("#city-input");
      const refreshButton = document.querySelector("#refresh-button");
      const status = document.querySelector("#status");
      const summaryCards = document.querySelector("#summary-cards");
      const logsBody = document.querySelector("#logs-body");
      let temperatureChart;

      // Show a user-facing status message.
      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("error", isError);
      }

      // Create a text-only element to safely render API values.
      function textElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.textContent = text;
        return element;
      }

      // Render per-city cards using the summary API response.
      function renderSummaries(summaries) {
        summaryCards.replaceChildren();
        if (summaries.length === 0) {
          summaryCards.append(textElement("p", "empty", "No city observations yet. Add a city to get started."));
          return;
        }

        for (const summary of summaries) {
          const card = document.createElement("article");
          card.className = "card";
          card.append(textElement("h3", "", summary.city));
          card.append(textElement("div", "card-temp", `${Number(summary.latest_temperature).toFixed(1)}°C`));
          card.append(textElement("div", "card-detail", `Average ${Number(summary.average_temperature).toFixed(1)}°C · ${summary.log_count} ${summary.log_count === 1 ? "observation" : "observations"}`));
          summaryCards.append(card);
        }
      }

      // Render recent observations and update the temperature line chart.
      function renderLogs(logs) {
        logsBody.replaceChildren();
        if (logs.length === 0) {
          const row = document.createElement("tr");
          const cell = textElement("td", "empty", "No logs yet.");
          cell.colSpan = 6;
          row.append(cell);
          logsBody.append(row);
        }

        for (const log of logs) {
          const row = document.createElement("tr");
          const values = [
            log.city,
            `${Number(log.temperature_c).toFixed(1)}°C`,
            log.condition,
            `${log.humidity}%`,
            `${Number(log.wind_kmh).toFixed(1)} km/h`,
            new Date(`${log.created_at.replace(" ", "T")}Z`).toLocaleString()
          ];
          for (const value of values) row.append(textElement("td", "", value));
          logsBody.append(row);
        }

        if (typeof Chart === "undefined") {
          setStatus("The chart library could not load. Logs and summaries are still available.", true);
          return;
        }

        temperatureChart?.destroy();
        const chartLogs = [...logs].reverse();
        temperatureChart = new Chart(document.querySelector("#temperature-chart"), {
          type: "line",
          data: {
            labels: chartLogs.map((log) => `${log.city} · ${new Date(`${log.created_at.replace(" ", "T")}Z`).toLocaleTimeString()}`),
            datasets: [{
              label: "Temperature (°C)",
              data: chartLogs.map((log) => log.temperature_c),
              borderColor: "#62e0c0",
              backgroundColor: "rgba(98, 224, 192, 0.14)",
              pointBackgroundColor: "#a5f2df",
              pointRadius: 4,
              tension: 0.35,
              fill: true
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: "#dbe7f4" } } },
            scales: {
              x: { ticks: { color: "#98abc0", maxRotation: 35 }, grid: { color: "rgba(152, 171, 192, 0.1)" } },
              y: { title: { display: true, text: "°C", color: "#98abc0" }, ticks: { color: "#98abc0" }, grid: { color: "rgba(152, 171, 192, 0.1)" } }
            }
          }
        });
      }

      // Fetch dashboard data concurrently and render the latest state.
      async function loadDashboard() {
        const [logsResponse, summaryResponse] = await Promise.all([
          fetch("/api/logs"),
          fetch("/api/summary")
        ]);
        if (!logsResponse.ok || !summaryResponse.ok) throw new Error("Could not load dashboard data.");
        const [logs, summaries] = await Promise.all([logsResponse.json(), summaryResponse.json()]);
        renderLogs(logs);
        renderSummaries(summaries);
      }

      // Fetch current weather for the requested city and save it through the API.
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const city = cityInput.value.trim();
        if (!city) return;

        refreshButton.disabled = true;
        setStatus(`Fetching current weather for ${city}…`);
        try {
          const response = await fetch(`/api/refresh?${new URLSearchParams({ city })}`, { method: "POST" });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error ?? "Weather refresh failed.");
          setStatus(`Saved ${result.city}: ${Number(result.temperature_c).toFixed(1)}°C, ${result.condition}.`);
          await loadDashboard();
          cityInput.value = "";
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          refreshButton.disabled = false;
        }
      });

      // Load initial API data and show recoverable failures in the page.
      loadDashboard().catch((error) => setStatus(error.message, true));
    </script>
  </body>
</html>
